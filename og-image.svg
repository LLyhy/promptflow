<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Background glow orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1000" cy="450" r="220" fill="#8b5cf6" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="600" cy="600" r="150" fill="#a855f7" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Decorative lines -->
  <line x1="80" y1="200" x2="350" y2="200" stroke="#6366f1" stroke-width="2" opacity="0.15"/>
  <line x1="850" y1="430" x2="1120" y2="430" stroke="#8b5cf6" stroke-width="2" opacity="0.15"/>

  <!-- Flow lines -->
  <path d="M 50 500 Q 200 350, 400 450 T 750 380 T 1150 420" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.2"/>
  <path d="M 50 520 Q 250 400, 450 480 T 800 420 T 1150 460" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.12"/>

  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="2">
    PromptFlow
  </text>

  <!-- Subtitle -->
  <text x="600" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.7)" letter-spacing="4">
    让灵感流动起来
  </text>

  <!-- Feature pills -->
  <g transform="translate(600, 380)">
    <rect x="-340" y="-20" width="200" height="40" rx="20" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="-240" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#a78bfa">🎨 智能提示词</text>

    <rect x="-110" y="-20" width="200" height="40" rx="20" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="-10" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#c4b5fd">🔍 反向提纯</text>

    <rect x="120" y="-20" width="220" height="40" rx="20" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="230" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#d8b4fe">🖼️ 一键封面生成</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.35)" letter-spacing="1">
    完全免费 · 无需登录 · AI 创作者工具集
  </text>

  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.25)">
    llyhy.github.io/promptflow
  </text>
</svg>
