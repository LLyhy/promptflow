<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="AI提示词宝库 - 精选优质提示词助力创作，移动端专用">
    <meta name="keywords" content="AI提示词,Prompt,AI绘画,ChatGPT,提示词生成,移动端">
    <title>PromptFlow | AI提示词宝库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }

        /* Particle background */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            border-radius: 50%;
            opacity: 0.6;
            animation: floatParticle 20s infinite linear;
        }
        @keyframes floatParticle {
            from { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            to { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        /* Header */
        .header {
            padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:active {
            transform: scale(0.95);
            background: rgba(14, 163, 184, 0.3);
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Search */
        .search-box {
            margin-top: 12px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 44px;
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
        }
        .search-input::placeholder {
            color: #64748b;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
        }
        .clear-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
            display: none;
            cursor: pointer;
        }

        /* Category tabs */
        .category-tabs {
            padding: 10px 16px 8px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            scrollbar-width: none;
            background: rgba(15, 23, 42, 0.6);
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .category-tab {
            padding: 7px 14px;
            background: rgba(30, 27, 75, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s;
            font-weight: 500;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        /* Content area */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            position: relative;
            z-index: 1;
        }
        .content::-webkit-scrollbar {
            width: 3px;
        }
        .content::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 2px;
        }

        /* Stats row */
        .stats-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-item {
            flex: 1;
            background: rgba(30, 27, 75, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 11px;
            color: #94a3b8;
        }

        /* Prompt cards */
        .prompt-card {
            background: rgba(30, 27, 75, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            transition: all 0.2s;
            position: relative;
        }
        .prompt-card:active {
            transform: scale(0.98);
        }
        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .prompt-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 2px;
            flex: 1;
        }
        .fav-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            margin-left: 8px;
            color: #64748b;
            transition: all 0.2s;
        }
        .fav-toggle.active {
            color: #ec4899;
        }
        .prompt-category {
            font-size: 11px;
            color: #0ea5e9;
            background: rgba(14, 165, 233, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-right: 6px;
        }
        .prompt-content {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .prompt-content.expanded {
            -webkit-line-clamp: unset;
        }
        .prompt-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .tag {
            font-size: 11px;
            color: #94a3b8;
            background: rgba(148, 163, 184, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
        }
        .model-info {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .model-info-header {
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
        .model-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .model-tag {
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 6px;
            font-weight: 600;
        }
        .model-tag.high { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .model-tag.mid { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .model-tag.low { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .model-note {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            margin-top: 6px;
        }
        .prompt-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            min-width: 0;
            padding: 9px;
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
        .action-btn.secondary {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
        }

        /* Bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(148, 163, 184, 0.15);
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 2px;
            cursor: pointer;
            color: #64748b;
            transition: color 0.3s;
            position: relative;
            font-size: 11px;
        }
        .nav-item.active {
            color: #0ea5e9;
        }
        .nav-icon {
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }
        .nav-badge {
            position: absolute;
            top: 2px;
            right: calc(50% - 22px);
            background: #ef4444;
            color: white;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 14px;
            text-align: center;
            display: none;
        }
        .nav-badge.show {
            display: block;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: rgba(30, 27, 75, 0.98);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 12px;
            text-align: center;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: rgba(148, 163, 184, 0.15);
            border-radius: 50%;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            border: none;
        }
        .modal-content-text {
            font-size: 14px;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 10px;
            padding: 12px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 27, 75, 0.98);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 12px;
            padding: 14px 24px;
            color: #e2e8f0;
            font-size: 14px;
            z-index: 2000;
            animation: toastIn 0.3s ease;
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 80%;
            text-align: center;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }
        .empty-icon {
            font-size: 56px;
            margin-bottom: 14px;
            opacity: 0.5;
        }
        .empty-text {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Generator section */
        .generator-section {
            margin-top: 10px;
        }
        .generator-input {
            width: 100%;
            padding: 14px;
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 14px;
            min-height: 90px;
            resize: vertical;
            outline: none;
            line-height: 1.6;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .generator-input:focus {
            border-color: #0ea5e9;
        }
        .style-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .style-tab {
            padding: 7px 12px;
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 0;
            text-align: center;
        }
        .style-tab.active {
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            border-color: transparent;
            color: white;
        }
        .generator-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0ea5e9, #a855f7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
        }
        .generator-btn:active {
            transform: scale(0.98);
        }
        .generator-result {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 14px;
            margin-top: 14px;
        }
        .generator-result-title {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .generator-result-text {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.8;
            white-space: pre-wrap;
            margin-bottom: 12px;
            word-break: break-word;
        }

        /* Section header */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 12px;
        }

        /* Reverse page */
        .upload-area {
            border: 2px dashed rgba(148, 163, 184, 0.3);
            border-radius: 14px;
            padding: 35px 20px;
            text-align: center;
            background: rgba(30, 27, 75, 0.3);
            margin-bottom: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:active {
            border-color: #0ea5e9;
            background: rgba(14, 165, 233, 0.1);
        }
        .upload-icon { font-size: 44px; margin-bottom: 10px; }
        .upload-text { font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
        .upload-hint { font-size: 11px; color: #64748b; }
        .upload-preview {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 14px;
            max-height: 200px;
            object-fit: cover;
            display: none;
        }
        .upload-preview.show { display: block; }

        /* History item */
        .history-item {
            background: rgba(30, 27, 75, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .history-item-title {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
        .history-item-text {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .history-item-time {
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo-row">
            <div class="logo">✨ PromptFlow</div>
            <div class="icon-btn" onclick="location.href='../index.html'" title="返回电脑版">🖥️</div>
        </div>
        <div class="title">AI提示词宝库</div>
        <div class="subtitle">精选优质提示词，释放AI无限潜能</div>
        <div class="search-box" id="searchBox">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索提示词...">
            <span class="clear-btn" id="clearSearch" onclick="clearSearch()">✕</span>
        </div>
    </div>

    <!-- Category tabs -->
    <div class="category-tabs" id="categoryTabs"></div>

    <!-- Content -->
    <div class="content" id="content">
        <!-- Prompts view -->
        <div id="promptsView"></div>

        <!-- Favorites view -->
        <div id="favoritesView" style="display:none"></div>

        <!-- History view -->
        <div id="historyView" style="display:none"></div>

        <!-- Generator view -->
        <div id="generatorView" style="display:none">
            <div class="section-title">🧠 智能提示词生成器</div>
            <textarea class="generator-input" id="generatorInput" placeholder="描述你的需求，例如：帮我写一个赛博朋克风格少女的绘画提示词..."></textarea>
            <div class="style-tabs" id="styleTabs">
                <div class="style-tab active" data-style="detailed">📝 详细版</div>
                <div class="style-tab" data-style="concise">✍️ 简洁版</div>
                <div class="style-tab" data-style="poetic">🎭 诗意版</div>
                <div class="style-tab" data-style="professional">💼 专业版</div>
            </div>
            <button class="generator-btn" onclick="generatePrompt()">✨ 生成提示词</button>
            <div class="generator-result" id="generatorResult" style="display:none">
                <div class="generator-result-title">📄 生成结果</div>
                <div class="generator-result-text" id="generatedPrompt"></div>
                <button class="action-btn" onclick="copyGenerated()">📋 复制提示词</button>
            </div>
        </div>

        <!-- Reverse view -->
        <div id="reverseView" style="display:none">
            <div class="section-title">🖼️ 图片反向提纯</div>
            <div class="upload-area" onclick="document.getElementById('imageInput').click()">
                <div class="upload-icon">📸</div>
                <div class="upload-text">点击上传图片</div>
                <div class="upload-hint">AI将分析图片生成提示词</div>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
            <img id="imagePreview" class="upload-preview" />
            <div id="reverseResult" style="display:none"></div>
        </div>
    </div>

    <!-- Bottom nav -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('prompts')">
            <div class="nav-icon">📚</div>
            <div class="nav-label">提示词库</div>
        </div>
        <div class="nav-item" onclick="switchView('favorites')">
            <div class="nav-icon">⭐</div>
            <div class="nav-label">收藏</div>
            <div class="nav-badge" id="favBadge"></div>
        </div>
        <div class="nav-item" onclick="switchView('history')">
            <div class="nav-icon">📝</div>
            <div class="nav-label">历史</div>
            <div class="nav-badge" id="historyBadge"></div>
        </div>
        <div class="nav-item" onclick="switchView('generator')">

            p.style.animationDuration = (15 + Math.random() * 15) + 's';
            p.style.animationDelay = (-Math.random() * 20) + 's';
            p.style.opacity = 0.3 + Math.random() * 0.4;
            container.appendChild(p);
        }
    }

                renderPrompts();

            container.appendChild(btn);
        });

            if (!currentSearch) return true;
            return (p.title + p.content + p.tags.join(' ') + p.category).toLowerCase().includes(currentSearch);

    }

            return;

        container.innerHTML = list.map(p => renderCard(p)).join('');

            </div>

    }

    function renderFavorites() {
        const container = document.getElementById('favoritesView');
        const favs = prompts.filter(p => localStorage.getItem('fav_' + p.id) === '1');
        if (favs.length === 0) {
            container.innerHTML = emptyState('⭐', '还没有收藏任何提示词<br>点击提示词卡片的爱心按钮收藏');
            return;
        }
        container.innerHTML = favs.map(p => renderCard(p)).join('');
    }

    // ==== 历史 ====
    function addHistory(title, content) {
        const history = JSON.parse(localStorage.getItem('history') || '[]');
        history.unshift({ title, content, time: new Date().toLocaleString('zh-CN') });
        localStorage.setItem('history', JSON.stringify(history.slice(0, 50)));
        updateBadges();
    }

    function renderHistory() {
        const container = document.getElementById('historyView');
        const history = JSON.parse(localStorage.getItem('history') || '[]');
        if (history.length === 0) {
            container.innerHTML = emptyState('📝', '暂无历史记录<br>复制提示词后会自动记录');
            return;
        }
        container.innerHTML = history.map((h, i) => `
            <div class="history-item">
                <div class="history-item-title">${h.title}</div>
                <div class="history-item-text">${h.content}</div>
                <div class="history-item-time">${h.time}</div>
                <div style="margin-top:8px">
                    <button class="action-btn" onclick='copyPrompt(${JSON.stringify(h.content).replace(/'/g,"\\'")}, null, "${h.title.replace(/"/g,'&quot;')}")' style="padding:7px;font-size:12px">📋 复制</button>
                </div>
            </div>
        `).join('');
    }

    function updateBadges() {
        const favCount = prompts.filter(p => localStorage.getItem('fav_' + p.id) === '1').length;
        const histCount = JSON.parse(localStorage.getItem('history') || '[]').length;
        const fb = document.getElementById('favBadge');
        const hb = document.getElementById('historyBadge');
        if (fb) { fb.textContent = favCount; fb.classList.toggle('show', favCount > 0); }
        if (hb) { hb.textContent = histCount; hb.classList.toggle('show', histCount > 0); }
    }

    // ==== 视图切换 ====
    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.nav-item').forEach((n, i) => {
            const views = ['prompts', 'favorites', 'history', 'generator', 'reverse'];
            n.classList.toggle('active', views[i] === view);
        });
        ['promptsView', 'favoritesView', 'historyView', 'generatorView', 'reverseView'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
        document.getElementById(view + 'View').style.display = 'block';

        const sbox = document.getElementById('searchBox');
        sbox.style.display = (view === 'prompts') ? 'block' : 'none';
        document.getElementById('categoryTabs').style.display = (view === 'prompts') ? 'flex' : 'none';

        if (view === 'favorites') renderFavorites();
        if (view === 'history') renderHistory();

        document.getElementById('content').scrollTop = 0;
    }

    // ==== 搜索清除 ====
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        currentSearch = '';
        document.getElementById('clearSearch').style.display = 'none';
        renderPrompts();
    }

    // ==== 复制/弹窗 ====
    function copyPrompt(content, id, title) {
        copyText(content);
        if (title) addHistory(title, content);
    }

    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ 复制成功')).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }
    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('✅ 复制成功'); }
        catch(e) { showToast('复制失败，请手动复制'); }
        document.body.removeChild(ta);
    }

    let currentModalContent = '';
    function showModal(title, content) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalContent').textContent = content;
        currentModalContent = content;
        document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }
    function copyModalContent() {
        copyText(currentModalContent);
    }

    // ==== Toast ====
    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.style.display = 'none'; }, 1800);
    }

    // ==== 生成器（本地规则版，无需API） ====
    function generatePrompt() {
        const input = document.getElementById('generatorInput').value.trim();
        if (!input) { showToast('请先输入你的需求'); return; }

        const styleMap = {
            detailed: {
                prefix: '请作为一位专业的AI提示词工程师，基于以下需求生成详细、结构化的提示词：\n\n【需求】',
                suffix: '\n\n请按以下格式输出：\n1️⃣ 主体描述（谁/什么）\n2️⃣ 环境与背景\n3️⃣ 风格与艺术指导\n4️⃣ 光线与色彩\n5️⃣ 细节与质量要求\n6️⃣ 负向提示（不需要的元素）'
            },
            concise: { prefix: '请基于以下需求生成简洁有力的提示词：\n', suffix: '' },
            poetic: {
                prefix: '请以富有诗意和画面感的方式，为以下需求生成一段优美的提示词：\n',
                suffix: '\n\n要求：语言优美、意境深远、画面感强'
            },
            professional: {
                prefix: '请作为一位资深专家，基于以下需求生成专业、结构化、可直接使用的提示词：\n',
                suffix: '\n\n输出格式：\n- ROLE（角色）\n- CONTEXT（背景）\n- TASK（任务）\n- CONSTRAINTS（约束）\n- OUTPUT_FORMAT（输出格式）\n- EXAMPLE（示例）'
            }
        };
        const s = styleMap[currentStyle];
        const result = `${s.prefix}${input}${s.suffix}\n\n---\n💡 使用提示：以上内容可直接复制到 ChatGPT / Claude / 豆包 等大模型中使用。如需更专业的效果，可补充更多细节。`;

        document.getElementById('generatedPrompt').textContent = result;
        document.getElementById('generatorResult').style.display = 'block';
        showToast('✨ 已生成提示词模板');
    }
    function copyGenerated() {
        const txt = document.getElementById('generatedPrompt').textContent;
        copyText(txt);
        addHistory('智能生成', txt.slice(0, 100));
    }

    // ==== 图片反向提纯（本地关键词生成版） ====
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const preview = document.getElementById('imagePreview');
            preview.src = e.target.result;
            preview.classList.add('show');

            // 基于文件信息生成伪关键词（无AI API环境）
            const baseKeywords = [
                '高细节', '8K分辨率', '超高清', '专业摄影', '电影级光效',
                '真实质感', '精致细节', '柔和光线', '浅景深', '构图完美'
            ];
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            const keywords = baseKeywords.slice(0, 6).join('，');
            const resultHtml = `
                <div class="prompt-card">
                    <div class="prompt-title">🎨 图片分析结果</div>
                    <div style="font-size:12px;color:#94a3b8;margin:8px 0">文件大小: ${sizeMB} MB</div>
                    <div style="font-size:13px;color:#cbd5e1;line-height:1.7;margin-bottom:10px">
                        检测到主要元素: 主题突出、背景有层次、光线自然、色彩丰富
                    </div>
                    <div class="prompt-tags">
                        ${baseKeywords.slice(0,6).map(k => `<span class="tag">${k}</span>`).join('')}
                    </div>
                    <div class="model-info">
                        <div class="model-info-header">📝 推荐提示词</div>
                        <div style="font-size:12px;color:#cbd5e1;line-height:1.7;margin-top:6px">
                            ${keywords}，主图清晰，背景简洁，专业构图，电影级画面
                        </div>
                        <div class="model-note">💡 提示：在电脑版页面可获取更详细的分析。此移动端版本提供基础关键词参考。</div>
                    </div>
                    <div class="prompt-actions">
                        <button class="action-btn" onclick="copyText('${keywords}，主图清晰，背景简洁，专业构图，电影级画面')">📋 复制关键词</button>
                    </div>
                </div>
            `;
            const r = document.getElementById('reverseResult');
            r.innerHTML = resultHtml;
            r.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    function emptyState(icon, text) {
        return `<div class="empty-state"><div class="empty-icon">${icon}</div><div class="empty-text">${text}</div></div>`;
    }

    // 启动
    init();
    </script>
</body>
</html>
